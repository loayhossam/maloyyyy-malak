/* Layout: mobile-first column with bottom tab bar; sidebar + wide grid from 900px. Purple hero with the Maloy "O" character as the focal point. */
:root{--bg:#f5f2fc;--card:#ffffff;--card2:#efeaf9;--line:#e1d9f2;--tx:#191230;--mut:#6a6086;--pur:#7a2cff;--lime:#c8ff12;--on-lime:#0b0813;--aqua:#008a69;--pink:#d91c78;--red:#d92e45;--warn:#b86e00;--shadow:0 6px 24px rgba(60,30,120,.08);--accent-tx:#6a1fe0;--navbg:rgba(255,255,255,.94)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110a1f;--card:#1b1230;--card2:#271b45;--line:#35275a;--tx:#f4efff;--mut:#a99fc6;--pur:#a678ff;--aqua:#3ddfb0;--pink:#ff6bb3;--red:#ff7088;--warn:#ffb84d;--shadow:none;--accent-tx:#bda0ff;--navbg:rgba(27,18,48,.94);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#110a1f;--card:#1b1230;--card2:#271b45;--line:#35275a;--tx:#f4efff;--mut:#a99fc6;--pur:#a678ff;--aqua:#3ddfb0;--pink:#ff6bb3;--red:#ff7088;--warn:#ffb84d;--shadow:none;--accent-tx:#bda0ff;--navbg:rgba(27,18,48,.94);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Maloy Wide','Thmanyah Sans',Tahoma,'Segoe UI',system-ui,sans-serif;font-weight:700;font-size:15px;line-height:1.6;background:var(--bg);color:var(--tx);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden;min-height:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;font-weight:700;color:var(--tx)}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
b,strong{font-weight:900}
.mut{color:var(--mut);font-weight:400}
.red{color:var(--red)}.aq{color:var(--aqua)}

#app{max-width:1180px;margin:0 auto;display:block;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
#side{display:none}
#mainw{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:12px}
.top small{color:var(--mut);font-weight:400;font-size:13px;display:block}
.top h1{font-size:26px;font-weight:900;line-height:1.25}
.ic{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0}
.ic svg{width:21px;height:21px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#view{min-width:0}

/* bottom tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:14px;color:var(--mut);font-size:11px;font-weight:700}
.tb.on{color:var(--on-lime);background:var(--lime)}
.tb.mid{position:relative}

/* cards & basics */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card+.card,.card+.grid,.grid+.card,.grid+.grid{margin-top:14px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.h h2{font-size:17px;font-weight:900}
.h a,.lnk{color:var(--accent-tx);font-size:13px;background:none;text-decoration:none;font-weight:700;padding:6px 4px}
.btn{background:var(--lime);color:var(--on-lime);border-radius:14px;padding:12px 20px;font-weight:900;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card2);color:var(--tx)}
.btn.dng{background:var(--red);color:#fff}
.btn.blk{width:100%}
.mini{background:var(--card2);border-radius:10px;min-width:36px;height:36px;padding:0 10px;font-size:14px;display:inline-grid;place-items:center}
.mini:hover{background:var(--lime);color:var(--on-lime)}
.empty{color:var(--mut);font-weight:400;text-align:center;padding:22px 14px;border:1px dashed var(--line);border-radius:16px}
input,select,textarea{background:var(--card2);border:2px solid var(--line);border-radius:13px;padding:11px 13px;min-height:46px;outline:none;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--pur)}
textarea{min-height:100px;resize:vertical}
label.l{display:block;font-size:13px;color:var(--mut);font-weight:700;margin:12px 0 5px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:9px;padding:2px 10px;font-size:12px;font-weight:700;max-width:100%}
.pill{display:inline-block;border-radius:9px;padding:2px 10px;font-size:12px;font-weight:900;background:var(--lime);color:var(--on-lime)}
.pill.w{background:var(--red);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fc{position:relative;flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 16px;min-height:44px;font-weight:700;color:var(--mut)}
.fc.on{background:var(--lime);color:var(--on-lime);border-color:var(--lime);font-weight:900}
.fc small{display:block;font-size:11px;font-weight:400;opacity:.8;line-height:1.2}
.fc.today:not(.on){border-color:var(--pur);color:var(--tx)}

/* hero + character */
.hero{position:relative;border-radius:28px;color:#fff;overflow:hidden;padding:20px 16px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;background:radial-gradient(420px 200px at 15% 115%,rgba(255,45,154,.45),transparent),linear-gradient(135deg,#2b0a63,#7a2cff 70%,#4b14b8)}
.hero .hi{font-size:13px;opacity:.85;font-weight:400;margin-top:2px}
.hero h2{font-size:22px;font-weight:900;line-height:1.3}
.hero h2 em{font-style:normal;color:#c8ff12}
.hero .meta{color:#fff;font-weight:700;font-size:13px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.hero .meta span{background:rgba(255,255,255,.16);border-radius:12px;padding:3px 12px;font-size:13px}
.mascot{display:block;background:none;padding:0;margin:0 auto;line-height:0;touch-action:manipulation}
.mas{display:block;overflow:visible;max-width:100%}
.bub{position:relative;background:#fff;color:#191230;border-radius:20px;padding:12px 18px;font-size:15px;line-height:1.75;font-weight:700;min-height:50px;max-width:min(340px,100%);width:max-content;margin:0 auto 14px;box-shadow:0 10px 26px rgba(20,5,60,.28);display:flex;align-items:center;justify-content:center;text-align:center}
.bub .tail{position:absolute;bottom:-8px;left:50%;margin-left:-9px;width:18px;height:18px;background:#fff;transform:rotate(45deg);border-radius:0 0 5px 0}
.bub .bt{position:relative;z-index:1;overflow-wrap:anywhere}
.bub .bt.ty:after{content:"";display:inline-block;width:2px;height:1em;background:#7a2cff;margin-right:3px;vertical-align:-2px;animation:cur .7s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.hgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px;text-align:center;min-width:0}
.tile b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{display:block;color:var(--mut);font-weight:400;font-size:12px;margin-top:4px}
.tile.hl{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.tile.hl small{color:var(--on-lime);opacity:.75}
.tile svg{display:block;margin:0 auto 2px}

/* rows */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:16px;padding:12px;min-width:0}
.row .tb2{flex:1;min-width:0}
.row .tb2 b{display:block;overflow-wrap:anywhere}
.meta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mut);font-weight:400;margin-top:3px}
.row.dn{opacity:.55}.row.dn .tb2 b{text-decoration:line-through}
.ck{-webkit-appearance:none;appearance:none;width:26px;height:26px;min-height:0;border-radius:9px;border:2px solid var(--mut);background:transparent;padding:0;flex-shrink:0;cursor:pointer;display:grid;place-items:center}
.ck:checked{background:var(--lime);border-color:var(--lime)}
.ck:checked:after{content:"";width:6px;height:11px;border:solid var(--on-lime);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.lec{position:relative;border-inline-start:6px solid var(--c);align-items:stretch}
.lec .tm{min-width:68px;text-align:center;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;justify-content:center;font-size:14px}
.lec .tm small{color:var(--mut);font-weight:400;font-size:12px}
.lec.now{background:var(--lime);color:var(--on-lime)}
.lec.now .meta,.lec.now .tm small{color:var(--on-lime);opacity:.75}
.lec.past{opacity:.5}
.dh{font-size:14px;color:var(--mut);margin:14px 0 8px;font-weight:900}
.pri{color:var(--warn);font-size:12px;font-weight:900}
.sc{display:flex;flex-direction:column;gap:10px}
.sub{border-top:6px solid var(--c);text-align:right;width:100%;display:block;padding:14px}
.bar{height:9px;background:var(--card2);border-radius:9px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pur),var(--pink));border-radius:9px}
.cd{min-width:64px;text-align:center;line-height:1.1}
.cd b{font-size:30px;display:block;font-variant-numeric:tabular-nums}
.cd small{font-size:12px;color:var(--mut);font-weight:400}
.cd.hot b{color:var(--red)}
.nts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.note{border-radius:20px;padding:16px;color:#0b0813;min-height:130px;display:flex;flex-direction:column;gap:6px}
.note h4{font-size:17px;font-weight:900}.note p{white-space:pre-wrap;flex:1;font-weight:400;overflow-wrap:anywhere}
.note .a{display:flex;gap:6px;align-items:center;justify-content:space-between}
.note .mini{background:rgba(0,0,0,.14);color:#0b0813}
.n0{background:#c8ff12}.n1{background:#7dffd9}.n2{background:#b58bff}.n3{background:#ff8ac9}
.weekbars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
.wb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
.wb i{width:100%;max-width:34px;border-radius:9px 9px 3px 3px;background:var(--card2);min-height:4px}
.wb.on i{background:linear-gradient(180deg,var(--pur),var(--pink))}
.wb.td i{outline:2px solid var(--lime)}
.wb small{font-size:11px;color:var(--mut);font-weight:400}
.wb em{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums}
.qa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:14px}
.qa input[name=t]{grid-column:1/-1}
.qa .btn{grid-column:1/-1}
.ex-banner{margin-top:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card2);border:1px dashed var(--pur);border-radius:16px;padding:10px 14px;font-size:13px}
.ex-banner span{flex:1;min-width:180px;font-weight:400}

/* timer */
.tmw{display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:min(280px,78vw);aspect-ratio:1/1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--card2)}.ring .fg{stroke:var(--pur);stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.ring .t{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-size:clamp(40px,14vw,60px);font-variant-numeric:tabular-nums;line-height:1;direction:ltr}
.ring .t small{color:var(--mut);font-weight:400}
.tm-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sess{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

/* sheet */
#ov{position:fixed;left:0;right:0;top:0;bottom:0;z-index:60;background:rgba(18,10,36,.6);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;animation:fi .18s}
#ov[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:26px 26px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .24s cubic-bezier(.2,.9,.3,1);border:1px solid var(--line)}
.sheet h3{font-size:20px;font-weight:900;margin-bottom:4px}
.sheet .act{display:flex;gap:10px;margin-top:20px}
.sheet .act .btn{flex:1}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:-8px auto 14px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw label{cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.sw span{display:block;width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid transparent}
.sw input:checked+span{border-color:var(--tx)}
.sw input:focus-visible+span{outline:3px solid var(--pur);outline-offset:2px}
.mg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.mg button{background:var(--card2);border-radius:18px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:900}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;direction:ltr;text-align:left;font-weight:400}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--tx);color:var(--bg);border-radius:14px;padding:10px 16px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1;pointer-events:auto}
#toast button{color:var(--lime);font-weight:900;text-decoration:underline;padding:4px}
:root[data-theme="light"] #toast button{color:#7a2cff}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

/* floating character (other tabs) */
#fm{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
#fm[hidden]{display:none}
#fm .bub{margin:0;pointer-events:none;font-size:14px;padding:10px 14px;transform-origin:20% 100%;transform:scale(.6);opacity:0;transition:.2s;max-width:min(260px,calc(100vw - 32px));min-height:0;width:max-content;justify-content:flex-start;text-align:right}
#fm .bub.on{transform:none;opacity:1;pointer-events:auto}
#fm .bub .tail{left:26px;margin-left:0}
#fm .fw{pointer-events:auto;width:56px;height:56px;border-radius:19px;background:linear-gradient(135deg,#2b0a63,#7a2cff);display:grid;place-items:center;box-shadow:0 8px 22px rgba(60,20,140,.4);padding:0;overflow:visible}

/* splash */
#splash{position:fixed;left:0;right:0;top:0;bottom:0;z-index:100;display:flex;align-items:center;justify-content:center;color:#fff;background:radial-gradient(520px 320px at 20% 110%,rgba(255,45,154,.5),transparent),radial-gradient(420px 300px at 90% -10%,rgba(200,255,18,.18),transparent),linear-gradient(160deg,#25085a,#7a2cff 75%,#4b14b8);padding:24px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transition:opacity .45s,transform .45s;overflow:hidden}
#splash[hidden]{display:none}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:420px;text-align:center}
.sp .lg{height:20px;opacity:.9;margin-bottom:18px;display:block}
.sp .lg svg{height:100%;width:auto;display:block}
.sp .bub{min-height:84px;font-size:19px;max-width:100%;width:100%;margin-bottom:16px}
.sp .go{margin-top:20px;min-height:54px;padding:14px 38px;font-size:18px;animation:up .4s}
.sp .go[hidden]{display:none}
.sp .skip{color:#fff;opacity:.7;font-weight:400;padding:12px;margin-top:2px;font-size:14px}
.sp .skip[hidden]{display:none}

@media (min-width:900px){
 body{font-size:16px}
 #app{display:grid;grid-template-columns:250px minmax(0,1fr);column-gap:28px;padding-bottom:40px}
 #side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;align-self:start;height:100vh;padding:24px 0}
 #tabs{display:none}
 .sb{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--mut);width:100%;text-align:right;min-height:46px}
 .sb:hover{background:var(--card2);color:var(--tx)}
 .sb.on{background:var(--lime);color:var(--on-lime)}
 .logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;margin-bottom:20px;color:var(--tx)}
 .logo i{width:38px;height:38px;border-radius:12px;background:var(--lime);color:#0b0813;display:grid;place-items:center}
 .logo svg{height:22px;width:auto}

 .hgrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
 .grid.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .sc{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
 #ov{align-items:center}
 .sheet{border-radius:26px;padding-bottom:22px}
 .grab{display:none}
 #fm{bottom:24px}
 #toast{bottom:28px}
 .qa{grid-template-columns:2fr 1fr 1fr auto}
 .qa input[name=t],.qa .btn{grid-column:auto}
 .qa input[name=t]{grid-column:auto}
}
@media (max-width:380px){.tiles{gap:6px}.tile b{font-size:22px}.top h1{font-size:23px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#tabs{grid-template-columns:repeat(6,1fr)}.tb{font-size:10.5px}
.log{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow-y:auto;padding:2px 0 8px}
.cm{max-width:88%;padding:10px 14px;border-radius:18px;line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap}
.cm.c{background:var(--card2);border-top-right-radius:6px;align-self:flex-start}
.cm.u{background:var(--lime);color:var(--on-lime);border-top-left-radius:6px;align-self:flex-end}
.qr{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.qr .fc{flex-shrink:1}
.cf{display:grid;gap:8px;margin-top:10px}
.fcard{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:18px;line-height:1.8;padding:20px;background:var(--card2);border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.step{display:flex;gap:6px;margin-bottom:12px}.step i{flex:1;height:6px;border-radius:6px;background:var(--card2)}.step i.on{background:var(--pur)}
.qs{display:grid;gap:8px;margin:10px 0}.qs div{background:var(--card2);border-radius:14px;padding:10px 14px;font-weight:400}

<script>

 try{await fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({snap:snapshot(),tables:T})})}catch(e){}}
async function exportXlsx(){if(!window.XLSX)return toast('مكتبة Excel مش متاحة دلوقتي');
 let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
 const sn=id=>subOf(id).name,wb=XLSX.utils.book_new(),add=(n,h,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([h].concat(r)),n);
 add('المواد',['المادة','الدكتور','المواضيع','المنجز','دقائق المذاكرة'],S.subs.map(s=>{const t=topicStat(s.id);return[s.name,s.doc,t.n,t.d,S.sess.filter(x=>x.sub===s.id).reduce((a,x)=>a+x.min,0)]}));
 add('المحاضرات',['المادة','اليوم','من','إلى','النوع','المكان'],S.lec.map(l=>[sn(l.sub),DN[l.day],l.s,l.e,l.type,l.place]));
 add('المهام',['المهمة','المادة','الموعد','تمت'],S.tasks.map(t=>[t.t,sn(t.sub),t.due,t.done?'نعم':'لا']));
 add('الامتحانات',['المادة','النوع','التاريخ','الساعة','المكان'],S.exams.map(e=>[sn(e.sub),e.kind,e.date,e.time,e.place]));
 add('المواضيع',['المادة','الموضوع','تم','فهمي من 5','المراجعة القادمة'],S.topics.map(t=>[sn(t.sub),t.t,t.done?'نعم':'لا',t.m||'',t.rv||'']));
 add('الجلسات',['التاريخ','المادة','دقائق'],S.sess.map(x=>[x.date,sn(x.sub),x.min]));
 add('المزاج',['التاريخ','المزاج','السبب'],S.moods.map(m=>[m.date,mdOf(m.k)[1],m.why]));
 add('الكروت',['المادة','السؤال','الإجابة','الصندوق','المراجعة'],S.cards.map(c=>[sn(c.sub),c.q,c.a,c.box,c.due]));
 wb.Workbook={Views:[{RTL:true}]};
 try{if(!dl){XLSX.writeFile(wb,'maloy-study-'+today()+'.xlsx');return toast('اتحفظ ملف Excel')}await dl.save({filename:'maloy-study-'+today()+'.xlsx',data:XLSX.write(wb,{type:'array',bookType:'xlsx'})});toast('اتحفظ ملف Excel')}catch(e){toast('التنزيل اتلغى أو مش متاح')}}
Object.assign(AH,{
 mood:el=>{setTimeout(syncNow,300);const t=logMood(el.dataset.k).split('\n');render();say(t[0],{force:1});if(t[1])setTimeout(()=>say(t[1],{force:1}),7000)},
 mwhy:el=>{setTimeout(syncNow,300);const t=moodToday();if(!t)return;t.why=el.dataset.w;save();render();if(WHY[t.why])say(WHY[t.why],{force:1})},
 pushon:()=>{S.me.push=!S.me.push;save();syncNow();render();toast(S.me.push?'المزامنة اشتغلت':'المزامنة اتوقفت')},
 xl:()=>exportXlsx(),
 gs:()=>{const u=prompt('الصقي رابط Apps Script (بينتهي بـ /exec). سيبيه فاضي لإيقاف الربط',S.me.gs||'');if(u===null)return;S.me.gs=u.trim();GH='';save();syncNow();render();toast(S.me.gs?'اتربط بالشيت ✅':'اتفصل الربط')}});

init();
})();

</script>
